name: Build

# Build the client on every pull request and every push to master.
# On master, if the clientVersion in src/haven/Config.java has no tag yet,
# tag the commit and publish a GitHub release with the packaged client.
# The in-client update check (GitHubVersionFetcher) reads the latest
# release's tag_name, so publishing the release is what makes new
# versions show up on the login screen. The client then installs itself
# from the plain Apricot-$version.zip asset (see haven.Updater), which
# must therefore keep both its name and its runtime-less contents: the
# install it is unpacked over already has a jre.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache external libraries
        uses: actions/cache@v4
        with:
          path: lib/ext
          key: extlib-${{ hashFiles('build.xml') }}

      - name: Build client
        run: ant deftgt

      - name: Package client
        run: |
          version=$(sed -n 's/.*clientVersion = "\(.*\)".*/\1/p' src/haven/Config.java)
          echo "version=$version" >> "$GITHUB_ENV"
          (cd bin && zip -qr "../Apricot-$version.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: Apricot-${{ env.version }}
          path: Apricot-${{ env.version }}.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for the changelog since the previous tag.
          fetch-depth: 0

      - name: Check for existing tag
        id: tag
        run: |
          version=$(sed -n 's/.*clientVersion = "\(.*\)".*/\1/p' src/haven/Config.java)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "refs/tags/$version" > /dev/null; then
            echo "Tag $version already exists; skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          name: Apricot-${{ steps.tag.outputs.version }}

      - name: Bundle Java runtime
        if: steps.tag.outputs.exists == 'false'
        env:
          # Temurin Java 25 from the Adoptium API. Change jdk to jre here to
          # ship the much smaller runtime-only image instead.
          JAVA_URL_BASE: https://api.adoptium.net/v3/binary/latest/25/ga
          JAVA_IMAGE: jdk
        run: |
          version="${{ steps.tag.outputs.version }}"
          mkdir client && unzip -q "Apricot-$version.zip" -d client

          # Windows x64 bundle
          curl -sSfL -o java-windows.zip \
            "$JAVA_URL_BASE/windows/x64/$JAVA_IMAGE/hotspot/normal/eclipse"
          mkdir java-windows && unzip -q java-windows.zip -d java-windows
          mv java-windows/jdk-* client/jre
          (cd client && zip -qr "../Apricot-$version-windows-x64.zip" .)
          rm -rf client/jre

          # Linux x64 bundle (tar.gz to preserve execute permissions)
          curl -sSfL -o java-linux.tar.gz \
            "$JAVA_URL_BASE/linux/x64/$JAVA_IMAGE/hotspot/normal/eclipse"
          mkdir java-linux && tar -xzf java-linux.tar.gz -C java-linux
          mv java-linux/jdk-* client/jre
          chmod +x client/Play_Linux.sh client/hafen.jar
          tar -czf "Apricot-$version-linux-x64.tar.gz" -C client .

      - name: Tag and release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.tag.outputs.version }}"
          gh release create "$version" \
            "Apricot-$version-windows-x64.zip" \
            "Apricot-$version-linux-x64.tar.gz" \
            "Apricot-$version.zip" \
            "ApricotLauncher.bat" \
            "ApricotLauncher.sh" \
            --title "$version" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --notes "Already have Apricot? It updates itself — the login screen will offer this version next time you start it. New here? Grab ApricotLauncher.bat (Windows) or ApricotLauncher.sh (Linux) to install it. The Windows and Linux packages include Java 25 (Temurin), no Java installation needed. The plain zip requires an installed Java 17-25."

      - name: Announce release on Discord
        if: steps.tag.outputs.exists == 'false'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret configured; skipping announcement."
            exit 0
          fi
          version="${{ steps.tag.outputs.version }}"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then
            header="**Changes since $prev:**"
            log=$(git log --no-merges --pretty='- %s' "$prev..HEAD")
          else
            header="**Recent changes:**"
            log=$(git log --no-merges --pretty='- %s' -20)
          fi
          desc=$(printf '%s\n%s' "$header" "$log" | head -c 3900)
          jq -n \
            --arg title "Apricot $version is out! 🍑" \
            --arg url "https://github.com/${{ github.repository }}/releases/tag/$version" \
            --arg desc "$desc" \
            --arg downloads "[Apricot Launcher (Windows)](https://github.com/${{ github.repository }}/releases/latest/download/ApricotLauncher.bat) · [Apricot Launcher (Linux)](https://github.com/${{ github.repository }}/releases/latest/download/ApricotLauncher.sh) · [All downloads](https://github.com/${{ github.repository }}/releases/latest)" \
            '{embeds: [{
               title: $title,
               url: $url,
               description: $desc,
               color: 3966687,
               fields: [{name: "Download", value: $downloads}],
               footer: {text: "Existing installs update themselves from the login screen."}
             }]}' > discord-payload.json
          curl -sSf -H "Content-Type: application/json" \
            -d @discord-payload.json "$DISCORD_WEBHOOK"
